name: Publish installer to Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/installer-pages.yml, index.html, privacy.html]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: installer-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html privacy.html site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
